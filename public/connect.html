<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription</title>
    <link rel="stylesheet" href="static/connect.css">
    <link rel="stylesheet" href="ui/styles.css">
</head>
<body>
    <section class="bg">
    </section>
    <section class="container">
        <!-- Formulaire de connexion -->
        <section id="loginContainer" class="form-container">
            <h1>Connexion</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginMail">Email :</label>
                    <input type="email" id="loginMail" required placeholder="Entrez votre email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Mot de passe :</label>
                    <input type="password" id="loginPassword" required placeholder="Entrez votre mot de passe">
                </div>
                <button type="submit" class="btn-submit">Se connecter</button>
            </form>
            <p>Vous n'avez pas de compte ? <a href="#" id="showRegister">Inscrivez-vous</a></p>
        </section>

        <!-- Formulaire d'inscription (initiallement caché) -->
        <section id="registerContainer" class="form-container hidden">
            <h1>Inscription</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerFirstName">Prénom :</label>
                    <input type="text" id="registerFirstName" required placeholder="Entrez votre prénom">
                </div>
                <div class="form-group">
                    <label for="registerLastName">Nom :</label>
                    <input type="text" id="registerLastName" required placeholder="Entrez votre nom">
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email :</label>
                    <input type="email" id="registerEmail" required placeholder="Entrez votre email">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Mot de passe :</label>
                    <input type="password" id="registerPassword" required placeholder="Minimum 8 caractères">
                </div>
                <button type="submit" class="btn-submit">S'inscrire</button>
            </form>
            <p>Déjà un compte ? <a href="#" id="showLogin">Connectez-vous</a></p>
        </section>
    </section>
    <script src="ui/script.js"></script>
</body>
</html>
